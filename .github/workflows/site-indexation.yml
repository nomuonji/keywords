# Quota-aware Search Console URL Inspection acquisition.
#
# Protect the shared Firestore project's read/write budget for interactive SEO.
# Two scheduled sweeps can process at most 400 URLs/day across properties.
# Per-property quota leaves room for explicit diagnostics, and full Firestore
# inventory scans are controlled independently by site measurement.
name: site-indexation

on:
  workflow_dispatch:
  schedule:
    # 05:17 and 17:17 JST, away from 02:23 daily measurement.
    - cron: '17 8,20 * * *'

permissions:
  contents: read

concurrency:
  group: site-indexation
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SITES_INDEXATION_DAILY_BUDGET: '400'
      SITE_INDEXATION_GLOBAL_RUN_BUDGET: '200'
      SITE_INDEXATION_PROPERTY_RUN_BUDGET: '120'
      SITE_INDEXATION_SITE_CHUNK: '25'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Write Google service account file
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS secret is empty; runner will use any available machine credentials"
            exit 0
          fi
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-sa.json" >> "$GITHUB_ENV"

      - name: Inspect due URLs within property budgets
        run: npx tsx scripts/site-indexation-sweep.ts
