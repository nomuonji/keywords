# Quota-aware Search Console URL Inspection acquisition.
#
# The URL Inspection API is limited to 2,000 requests/day per Search Console
# property (not per registered site). Four sweeps at up to 450/property each
# reserve 200/day for explicit checks and headroom. Indexation URL state is
# now stored in compressed per-site Firestore bundles instead of URL docs.
name: site-indexation

on:
  # Run one reconciliation immediately when scheduler behavior changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-indexation.yml'
      - 'scripts/site-indexation-sweep.ts'
      - 'scripts/site-indexation-policy.ts'
  workflow_dispatch:
  schedule:
    # 04:17, 10:17, 16:17, 22:17 JST, away from 02:23 measurement.
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: read

concurrency:
  group: site-indexation
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      # Sites Operator data lives in its own Firebase project (docs/firestore-project-split.md).
      SITES_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITES_FIREBASE_SERVICE_ACCOUNT_JSON }}
      SITES_FIREBASE_PROJECT_ID: ${{ vars.SITES_FIREBASE_PROJECT_ID }}
      SITES_INDEXATION_DAILY_BUDGET: '1900'
      SITE_INDEXATION_GLOBAL_RUN_BUDGET: '3600'
      SITE_INDEXATION_PROPERTY_RUN_BUDGET: '450'
      SITE_INDEXATION_SITE_CHUNK: '50'
      # Recheck eligible unresolved URLs after 48h when regular due work leaves quota unused.
      SITE_INDEXATION_PROACTIVE_MIN_AGE_HOURS: '48'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Write Google service account file
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS secret is empty; runner will use any available machine credentials"
            exit 0
          fi
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-sa.json" >> "$GITHUB_ENV"

      - name: Inspect due URLs, then proactively refill unused quota
        run: npx tsx scripts/site-indexation-sweep.ts
