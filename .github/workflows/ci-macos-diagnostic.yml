name: ci-macos-diagnostic
on:
  push:
    branches: [feat/gsc-query-feedback-loop]
permissions:
  contents: read
jobs:
  changed-typecheck:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [research, commands, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck -w @keywords/${{ matrix.workspace }}
  feedback-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:site-query-feedback
      - run: npm run build -w @keywords/web
