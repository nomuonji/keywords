name: site-indexation-live-test

on:
  push:
    branches:
      - test/indexation-live-20261008
    paths:
      - .github/workflows/site-indexation-live-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
      SITES_INDEXATION_DAILY_BUDGET: '1500'
      KEYWORDS_AGENT_ID: indexation-live-test
      SITE_JOBS_JSON: >-
        [{"projectId":"051456ec-4926-4a06-89bb-37cc2248ba93","name":"shikaku-wiki","domain":"shikaku.antonbase.com","sitemapUrl":"https://shikaku.antonbase.com/sitemap.xml","gscProperty":"sc-domain:antonbase.com"}]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and init
        run: |
          npm install
          npm run db:init

      - name: Write Google service account file
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-sa.json" >> "$GITHUB_ENV"

      - name: Reconcile shikaku sitemap inventory
        run: npx tsx scripts/site-measurement-batch.ts

      - name: Inspect one live URL and print summary
        run: npx tsx scripts/site-indexation-live-test.ts
