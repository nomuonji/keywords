# Daily external measurement for the Sites Operator SEO planning loop.
#
# This workflow owns Google measurement so ChatGPT planning runs only read the
# already-prepared compact digest. Every active GSC-connected registered site
# is discovered and measured sequentially at runtime. Raw analytics rows live only in the runner's
# ephemeral SQLite database; Firestore receives one overwrite-only planning
# digest per site.
#
# Required repository configuration:
#   vars.FIREBASE_PROJECT_ID
#   secrets.FIREBASE_SERVICE_ACCOUNT_JSON
#   secrets.GOOGLE_APPLICATION_CREDENTIALS
#   secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL
name: site-measurement

on:
  workflow_dispatch:
  schedule:
    # Once per day, deliberately off the top of the hour: 17:23 UTC = 02:23 JST.
    - cron: '23 17 * * *'
permissions:
  contents: read

concurrency:
  group: site-measurement
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      # Sites Operator data lives in its own Firebase project once SITES_FIRESTORE_TARGET=sites
      # (docs/firestore-project-split.md). Unset/legacy keeps everything in the shared project.
      SITES_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITES_FIREBASE_SERVICE_ACCOUNT_JSON }}
      SITES_FIREBASE_PROJECT_ID: ${{ vars.SITES_FIREBASE_PROJECT_ID }}
      SITES_FIRESTORE_TARGET: ${{ vars.SITES_FIRESTORE_TARGET || 'legacy' }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
      KEYWORDS_AGENT_ID: site-measurement-actions
      KEYWORDS_ARTICLE_SYNC_MODE: lazy
      # Measure every active site with a registered GSC property.
      # The batch runner loads Site Registry, auto-links a stable local project
      # identity once, and skips sites without a property. No hardcoded inventory.


    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and init ephemeral database
        run: |
          npm install
          npm run db:init

      - name: Write Google service account file
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS secret is empty; runner will use any available machine credentials"
            exit 0
          fi
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-sa.json" >> "$GITHUB_ENV"

      - name: Discover and measure active GSC-connected Sites Operator sites
        run: npx tsx scripts/site-measurement-batch.ts
