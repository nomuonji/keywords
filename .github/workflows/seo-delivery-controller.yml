name: seo-delivery-controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-delivery-controller.yml'
      - 'scripts/seo-delivery-controller.ts'
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduled-run congestion.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: seo-delivery-controller
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SEO_DELIVERY_GITHUB_TOKEN: ${{ secrets.SEO_DELIVERY_GITHUB_TOKEN }}
      SEO_DELIVERY_MAX_TASKS: '20'
      SEO_DELIVERY_NO_CHECK_GRACE_MS: '120000'
      # Explicit owner-approved rollout for NEW SEO tasks only (2026-10-13 UTC).
      # Set repo variable ENABLED=0 to disable; existing Groq direct-push is unaffected.
      SEO_PREPARED_REF_HANDOFF_ENABLED: ${{ vars.SEO_PREPARED_REF_HANDOFF_ENABLED || '1' }}
      SEO_PREPARED_REF_HANDOFF_NOT_BEFORE: ${{ vars.SEO_PREPARED_REF_HANDOFF_NOT_BEFORE || '2026-10-13T05:50:00.000Z' }}

    steps:
      - name: Check central delivery credentials
        id: config
        shell: bash
        run: |
          if [ -z "$SEO_DELIVERY_GITHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEO_DELIVERY_GITHUB_TOKEN is not configured; controller remains idle."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --ignore-scripts

      - name: Deliver SEO branches
        if: steps.config.outputs.enabled == 'true'
        run: npx tsx scripts/seo-delivery-controller.ts
