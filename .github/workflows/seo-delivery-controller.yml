name: seo-delivery-controller

on:
  repository_dispatch:
    types: [seo_push_pending]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Optional exact SEO Task ID to replay after dispatch failure or late credential setup'
        type: string
        required: false
        default: ''
      verification_only:
        description: 'Only verify published SEO Tasks; do not run delivery'
        type: boolean
        required: false
        default: false
      verify_publications:
        description: 'Run the existing production publication verifier (no extra workflow)'
        type: boolean
        required: false
        default: true
      cleanup_limit:
        description: 'Maximum legacy merged branches to clean (0 means no sweep)'
        type: number
        required: false
        default: 0
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-delivery-controller.yml'
      - 'scripts/seo-delivery-controller.ts'
      - 'scripts/seo-publication-verifier.ts'
      - 'scripts/seo-publication-evidence.ts'
      - 'scripts/seo-site-ci.ts'
      - 'scripts/seo-delivery-throughput.ts'
      - 'scripts/seo-prepared-ref-handoff-gate.ts'
      - 'packages/commands/src/seo-delivery-merge.ts'
  schedule:
    # Recovery sweep every two hours; also drain pending publication proofs.
    # push_pending normally wakes delivery via dispatch without extra publication reads.
    - cron: '17 */2 * * *'
    - cron: '13 4 * * *'

permissions:
  contents: read
  deployments: read

concurrency:
  group: seo-delivery-controller
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SEO_DELIVERY_GITHUB_TOKEN: ${{ secrets.SEO_DELIVERY_GITHUB_TOKEN }}
      # GitHub's Actions token has read permission even if the delivery PAT
      # lacks cross-repository Deployments scope.
      SEO_PUBLICATION_GITHUB_TOKEN: ${{ github.token }}
      # Read-only Pages publication proof; if unset, GitHub deployments still work.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SEO_DELIVERY_MAX_TASKS: '2'
      SEO_DELIVERY_TASK_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.task_id || github.event_name == 'workflow_dispatch' && inputs.task_id || '' }}
      # Normal delivery never rescans and deletes up to 100 historical refs.
      # A manual workflow_dispatch may opt in to at most ten legacy deletions.
      SEO_DELIVERY_CLEANUP_SWEEP_LIMIT: ${{ github.event.inputs.cleanup_limit || '0' }}
      # Unified post-cutover transport for both ChatGPT and Groq Workers.
      # Existing pre-cutover PRs drain through the legacy controller path.
      # Set repo variable ENABLED=0 only to halt new prepared-ref delivery.
      SEO_PREPARED_REF_HANDOFF_ENABLED: ${{ vars.SEO_PREPARED_REF_HANDOFF_ENABLED || '1' }}
      SEO_PREPARED_REF_HANDOFF_NOT_BEFORE: ${{ vars.SEO_PREPARED_REF_HANDOFF_NOT_BEFORE || '2026-10-13T05:50:00.000Z' }}

    steps:
      - name: Check central delivery credentials
        id: config
        shell: bash
        run: |
          if [ -z "$SEO_DELIVERY_GITHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEO_DELIVERY_GITHUB_TOKEN is not configured; controller remains idle."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --ignore-scripts

      - name: Deliver SEO branches
        if: steps.config.outputs.enabled == 'true' && github.event.schedule != '13 4 * * *' && !(github.event_name == 'workflow_dispatch' && inputs.verification_only)
        run: npx tsx scripts/seo-delivery-controller.ts

      - name: Verify published SEO Tasks
        # The old daily-only condition missed normal two-hourly sweeps. Run on
        # scheduled sweeps and on edits to this verifier, not on each dispatch.
        # Keep publication independent if delivery itself fails.
        if: ${{ !cancelled() && steps.config.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.verify_publications || inputs.verification_only))) }}
        run: npx tsx scripts/seo-publication-verifier.ts
