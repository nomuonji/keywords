name: seo-delivery-controller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-delivery-controller.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: seo-delivery-controller
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SEO_DELIVERY_GITHUB_TOKEN: ${{ secrets.SEO_DELIVERY_GITHUB_TOKEN }}
      SEO_DELIVERY_MAX_TASKS: '20'
      SEO_DELIVERY_NO_CHECK_GRACE_MS: '120000'

    steps:
      - name: Check central delivery credentials
        id: config
        shell: bash
        run: |
          if [ -z "$SEO_DELIVERY_GITHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEO_DELIVERY_GITHUB_TOKEN is not configured; controller remains idle."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --ignore-scripts

      - name: Migrate one legacy delivery task for smoke test
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'push'
        env:
          SEO_DELIVERY_MIGRATE_TASK_ID: a81c74b5-051f-40d6-8768-72fe3343c5b2
          SEO_DELIVERY_MIGRATE_BRANCH: seo/whiskies-producer-filter-price-context
          SEO_DELIVERY_MIGRATE_HEAD_SHA: bc9baf5f7095e624171baed2dd8931b3b5dae111
          SEO_DELIVERY_MIGRATE_BASE_SHA: 679d4b73dd424caf3ed41ec8b5faa5fb3a6616ea
          SEO_DELIVERY_MIGRATE_VALIDATION: "Worker local astro check had two pre-existing errors in astro.config.mjs (includeInSitemap and loadJsonDir implicit any); changed files were self-reviewed and no price values were changed."
        run: npx tsx scripts/seo-delivery-legacy-handoff.ts

      - name: Deliver SEO branches
        if: steps.config.outputs.enabled == 'true'
        run: npx tsx scripts/seo-delivery-controller.ts
