name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        workspace: [domain, db, research, commands, api, cli, mcp, web]
    runs-on: ubuntu-latest
    name: typecheck / ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck -w @keywords/${{ matrix.workspace }} 2>&1 | tee typecheck-${{ matrix.workspace }}.log
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-${{ matrix.workspace }}-${{ github.run_attempt }}
          path: typecheck-${{ matrix.workspace }}.log
          if-no-files-found: ignore
          retention-days: 3
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runtime acceptance suite
        shell: bash
        run: |
          set -o pipefail
          {
            npm install
            npm run db:init
            KEYWORDS_DB_PATH=/tmp/keywords-migration-smoke.sqlite npx tsx scripts/migration-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-planning-smoke.sqlite npx tsx scripts/planning-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-policy-smoke.sqlite npx tsx scripts/policy-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-work-loop-smoke.sqlite npx tsx scripts/work-loop-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-review-smoke.sqlite npx tsx scripts/review-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-operator-smoke.sqlite npx tsx scripts/operator-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-agent-operations-smoke.sqlite npx tsx scripts/agent-operations-smoke.ts
            npx tsx scripts/executor-selection-smoke.ts
            KEYWORDS_DB_PATH=/tmp/keywords-autopilot-smoke.sqlite npx tsx scripts/autopilot-smoke.ts
            npm run test:headless
            KEYWORDS_DB_PATH=/tmp/keywords-product-smoke.sqlite npx tsx scripts/product-workflow-smoke.ts
            npx tsx scripts/blog-smoke.ts
            npm run test:portfolio
            npx tsx scripts/recovery-smoke.ts
            npx tsx scripts/site-runtime-smoke.ts
            npx tsx scripts/maintenance-recovery-smoke.ts
            npx tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 --esModuleInterop --skipLibCheck scripts/autopilot-runner.ts
            KEYWORDS_DB_PATH=/tmp/keywords-product-smoke.sqlite npm run cli -- maintenance backup --destination /tmp/keywords-product-backup.sqlite
            npx tsx scripts/db-restore.ts /tmp/keywords-product-backup.sqlite /tmp/keywords-product-restored.sqlite
            KEYWORDS_DB_PATH=/tmp/keywords-product-restored.sqlite npm run cli -- project list
            npm run build -w @keywords/web
          } 2>&1 | tee runtime.log
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ github.run_attempt }}
          path: runtime.log
          if-no-files-found: ignore
          retention-days: 3
