name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        workspace: [domain, db, research, commands, api, cli, mcp, web]
    runs-on: ubuntu-latest
    name: typecheck / ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck -w @keywords/${{ matrix.workspace }}
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:init
      - run: npm run build -w @keywords/web
