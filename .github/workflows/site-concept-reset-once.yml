name: One-time site concept reset (explicit owner request)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-concept-reset-once.yml'
permissions:
  contents: read
jobs:
  delete-old-concepts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Delete exactly 17 known old records and verify only new concept remains
        run: npx tsx scripts/site-concept-reset-once.ts
